<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tagada · Vanilla store</title>
    <link rel="stylesheet" href="./assets/style.css" />
    <script type="importmap">
      {
        "imports": {
          "@tagadapay/core-js": "https://cdn.jsdelivr.net/npm/@tagadapay/core-js@3/dist/index.js"
        }
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@tagadapay/headless-sdk@1/dist/tagada-headless.min.js"></script>
  </head>
  <body>
    <header class="topbar">
      <strong id="brand">Tagada Vanilla</strong>
      <a class="cart-pill" href="#cart">
        Cart <span id="cart-count">0</span>
      </a>
    </header>

    <main>
      <section class="hero">
        <h1 id="brand-tagline">Headless checkout, the simple way.</h1>
        <p class="muted">
          Same Headless SDK as the React example — just plain HTML and
          JavaScript. Read <code>README.md</code> to set your STORE_ID.
        </p>
      </section>

      <section>
        <h2>Products</h2>
        <div id="products" class="grid">
          <p class="muted">Loading catalog…</p>
        </div>
      </section>

      <section id="cart">
        <h2>Cart</h2>
        <div id="cart-lines"></div>
        <div class="cart-footer">
          <div class="totals">
            <span>Subtotal</span>
            <strong id="cart-subtotal">$0.00</strong>
          </div>
          <button id="checkout-btn" class="btn-primary" disabled>
            Checkout
          </button>
          <p id="checkout-error" class="error"></p>
        </div>
      </section>
    </main>

    <script type="module" src="./assets/home.js"></script>
  </body>
</html>
